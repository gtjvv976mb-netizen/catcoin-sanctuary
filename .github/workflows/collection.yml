# Every hour (and by hand), reads Solana for StonkFun launches paid by the wallets listed in
# data/wallets.json, and commits data/*.json when, and only when, the builder changed them
# (scripts/build-collection.mjs). The builder's own tests run first (proving launches, the
# builder, the data rules and these workflows: `npm run test:builder`); a failing test, or a
# builder that stops (for instance because data/collection.json no longer validates), commits
# nothing, and the next run starts again from the same cursor. The site's content tests run in
# the Pages workflow instead, so a content change can hold up a deploy but never the recording of
# a launch. The Pages workflow publishes a commit made here.
#
# Secrets: one, optional. SOLANA_RPC_URL, an https RPC URL of your own (providers put a key in
# it, so it is a secret). Without it the public mainnet RPC is used, gently.
#
# The checkout keeps no credentials; the push hands the workflow token to git for that one
# command. The job may write repository contents and nothing else.
name: Collection

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm run test:builder
      - name: Read Solana and update the collection
        env:
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
        run: node scripts/build-collection.mjs
      - name: Commit the data if it changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -- 'data/*.json'
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git diff --cached --stat
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Collection: update from Solana"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          if ! git -c http.extraheader="AUTHORIZATION: basic $auth" push origin HEAD:main; then
            # main moved while this ran: replay the data commit on top of it, once.
            git -c http.extraheader="AUTHORIZATION: basic $auth" fetch origin main
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" rebase origin/main
            git -c http.extraheader="AUTHORIZATION: basic $auth" push origin HEAD:main
          fi
