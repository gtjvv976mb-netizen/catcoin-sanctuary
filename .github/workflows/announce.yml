# Announces new cats on X (@catcosanctuary): on a push to main that changes data/planned.json or
# data/release-queue.json, every 20 minutes, and by hand. While the initial roster lasts it posts
# one cat a run; after that it releases one approved cat from data/release-queue.json an hour,
# posting on X first and only then marking it released (data/releases.json) so the site shows it. scripts/announce.mjs drafts each new cat's post, checks it against
# the content rules, and posts at most perRun cats a run, spacingMinutes apart
# (data/announce-config.json). It starts with dryRun: true, which only writes the preview to
# data/announce-queue.json.
#
# In the same step, after the announcer, scripts/post-updates.mjs posts at most one more thing: a
# coin the sanctuary's launcher launched (data/sanctuary-launches.json) once the Collection has
# proved it, else a cat's adoption not posted yet (data/adoptions.json), else the next approved site update in
# data/updates.json, at least minGapMinutes after its last post and 15 minutes after the
# announcer's. Both always run; the step fails if either failed.
#
# Secrets: four, optional. X_API_KEY, X_API_SECRET, X_ACCESS_TOKEN, X_ACCESS_SECRET (OAuth 1.0a
# user context of the @catcosanctuary app, Read and Write). Only the posting step sees them.
# Without them the drafts go to data/announce-queue.json with one-click intent links.
#
# GitHub often skips or delays scheduled runs (for hours at a time), so each run also starts the
# next one itself: the "next" job waits until 20 minutes after this run began and dispatches the
# workflow again (a dispatch made with the workflow token does start a run). It dispatches only if
# no other Announce run is already queued or running, so there is never more than one chain; the
# schedule stays as the backup that restarts a broken chain. To stop the chain, set the repository
# variable ANNOUNCE_CHAIN to "off" (or disable the workflow).
#
# A run that released a cat (posted it on X and marked it released) starts the Launch workflow at
# once (the "launcher" job, while LAUNCH_ENABLED is on or dry): the launcher launches a posted cat's
# coin on pump.fun right after its post (scripts/lib/launcher.mjs sanctuaryRow), within its caps.
#
# The checkout keeps no credentials; the push hands the workflow token to git for that one
# command. The announce job may write repository contents and nothing else; the launcher and next
# jobs may only start workflow runs and run none of the repository's code.
name: Announce

on:
  push:
    branches: [main]
    paths:
      - data/planned.json
      - data/release-queue.json
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: announce
  cancel-in-progress: false

jobs:
  announce:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    outputs:
      released: ${{ steps.record.outputs.released }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: node --test tests/announce.test.mjs
      - name: Draft and post the new cats, then an adoption or site update
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: |
          status=0
          # Each poster runs whatever the others did: a thread X refuses never holds up the cats.
          node scripts/post-thread.mjs || status=$?
          node scripts/announce.mjs || status=$?
          node scripts/post-updates.mjs || status=$?
          exit "$status"
      - name: Commit the record if it changed
        id: record
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -- data/announced.json data/announce-queue.json data/release-queue.json data/releases.json data/next-cat.json data/intro-thread.json data/thread-*.json data/updates.json
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          # A cat released this run (posted on X): the launcher is started once this is pushed.
          if git diff --cached -- data/release-queue.json | grep -q '^+ *"status": "released"'; then released=true; else released=false; fi
          git diff --cached --stat
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Announce: record announced cats and posted updates"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          if ! git -c http.extraheader="AUTHORIZATION: basic $auth" push origin HEAD:main; then
            git -c http.extraheader="AUTHORIZATION: basic $auth" fetch origin main
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" rebase origin/main
            git -c http.extraheader="AUTHORIZATION: basic $auth" push origin HEAD:main
          fi
          echo "released=$released" >> "$GITHUB_OUTPUT"

  launcher:
    needs: announce
    if: ${{ !cancelled() && needs.announce.outputs.released == 'true' && (vars.LAUNCH_ENABLED == 'on' || vars.LAUNCH_ENABLED == 'dry') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Start the launcher now for the cat just posted
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh workflow run launch.yml -R "$REPO" --ref main

  next:
    needs: announce
    if: ${{ !cancelled() && vars.ANNOUNCE_CHAIN != 'off' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
    steps:
      - name: Start the next run 20 minutes after this one began
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          started=$(date -d "$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq .run_started_at)" +%s)
          wait=$(( started + 20 * 60 - $(date +%s) ))
          if [ "$wait" -gt 0 ]; then echo "Waiting ${wait}s."; sleep "$wait"; fi
          others=$(gh run list -R "$REPO" -w announce.yml -L 20 --json databaseId,status \
            --jq "[.[] | select(.status != \"completed\" and .databaseId != $RUN_ID)] | length")
          if [ "$others" -gt 0 ]; then echo "Another Announce run is already queued or running."; exit 0; fi
          gh workflow run announce.yml -R "$REPO" --ref main
