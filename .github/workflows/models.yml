# Automatic 3D models for the cats the sanctuary launches (scripts/models.mjs, around the repository's
# own tools: scripts/tripo.mjs, scripts/meshy.mjs, scripts/make-cat-models.py, scripts/render-cat-thumbs.mjs;
# see scripts/CAT-MODELS.md). Daily, by hand, and after a launch is recorded (the Launch workflow's publish
# job dispatches it). Each run makes at most MODELS_PER_RUN (1, at most 2) queued rebuilds from
# scripts/meshy.queue.json: launched cats with no model first; the rest of the queue only while
# MODELS_BACKLOG is on. Never a cat whose post's photo the owner hides (data/photo-hide.json).
#
# The jobs, each with only what it needs; files go between them as artifacts (scripts/models.mjs bundle,
# unbundle), and no job that installs a package holds a key it does not need or the push token:
#   pick        (contents: read; installs nothing; no secret) the model tests, then the cats and the tool that
#               makes them: MODELS_GENERATOR "tripo" or "meshy"; unset (the default) no API: made by hand via Higgsfield.
#   tripo-make  (contents: read; the Tripo CLI from tools/tripo-cli: npm ci --ignore-scripts, every package locked by
#               its hash) when the tool is Tripo: counts a try for each cat BEFORE calling Tripo, then a standing
#               reference picture from the queue entry's picture (image-to-image) and image-to-model (tripo-v3.1,
#               12000 faces, textured), about 40 credits, the GLB downloaded at once for the packer (it goes to Pack
#               in the artifact). A cat is started only when it can finish inside the step's time limit.
#               TRIPO_API_KEY is in its one step.
#   meshy       (contents: read; installs nothing: meshy.mjs is node built-ins) when the tool is Meshy: counts a try
#               for each cat BEFORE calling Meshy, then reference views, multi-image-to-3D, a remesh far copy (about
#               41 credits). MESHY_API_KEY is in its one step, and only here.
#   pack        (contents: read; no secret; npm packages installed with --ignore-scripts) the packer
#               (make-cat-models.py + gltfpack), the checks (the size budgets, a valid textured GLB, the garden's
#               rig on the model, tests/catmodels, catrig and meshy), a preview PNG. A model that fails is discarded.
#   tripo       (contents: read; tools/tripo-cli and tools/tripo-rig, as tripo-make) Tripo's quadruped rig of the packed model,
#               recorded (the site rigs its cats itself). TRIPO_API_KEY is in its one step; skipped with a log
#               line when it is missing. (TRIPO_API_KEY is in these two jobs only, one step each.)
#   commit      (contents: write; installs nothing third-party) takes only the expected files from the
#               artifacts, checks each piece and runs the model checks and tests again with node built-ins,
#               records a try that did not finish (a job that failed, timed out or was cancelled: it always
#               runs, so no spend goes unrecorded), and pushes with git hooks off.
#   pages       (actions: write) deploys the site; it runs no code of the repository's.
# The make, Pack and rig jobs check out the commit the Pick job ran the model tests on; the commit builds on main.
# A job that could not take the state of the job before it uploads nothing (its checkout's state is older).
# A cat gets at most 2 tries (scripts/models.state.json); a cat whose model fails keeps its portrait. A tool
# stops before its balance would drop under its reserve, and then no try is used.
#
# Repository variables: MODELS_ENABLED "on" runs it (anything else, or unset, runs nothing);
# MODELS_GENERATOR "tripo" or "meshy" (unset: no API, no credit spent); MODELS_TRIPO_MAKE_RESERVE, the credits Tripo keeps when it
# makes a model (0 by default: spend what is there); MODELS_MESHY_RESERVE and MODELS_TRIPO_RESERVE (the rig),
# the credits each keeps (100 by default, as the scripts); MODELS_PER_RUN (1 or 2); MODELS_BACKLOG "on" to
# rebuild queued cats that have a model already. No wallet key is anywhere near this workflow. The checkouts
# keep no credentials; the push hands the workflow token to git for that one command.
name: Models

on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: models
  cancel-in-progress: false

jobs:
  pick:
    if: ${{ vars.MODELS_ENABLED == 'on' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      keys: ${{ steps.pick.outputs.keys }}
      generator: ${{ steps.pick.outputs.generator }}
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: The commit the model tests run on (the make, Pack and rig jobs check out this one, not main again)
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: node --test tests/models.test.mjs tests/meshy.test.mjs
      - name: Choose the cats to make, and the tool that makes them
        id: pick
        env:
          MODELS_PER_RUN: ${{ vars.MODELS_PER_RUN }}
          MODELS_BACKLOG: ${{ vars.MODELS_BACKLOG }}
          MODELS_GENERATOR: ${{ vars.MODELS_GENERATOR }}
        run: node scripts/models.mjs pick

  tripo-make:
    needs: pick
    if: ${{ needs.pick.outputs.keys != '' && needs.pick.outputs.generator == 'tripo' }}
    runs-on: ubuntu-latest
    timeout-minutes: 130
    permissions:
      contents: read
    outputs:
      made: ${{ steps.make.outputs.made }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.pick.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install the Tripo CLI (tools/tripo-cli; every package at the version and hash its package-lock.json names)
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix tools/tripo-cli
          echo "$GITHUB_WORKSPACE/tools/tripo-cli/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Make the models with Tripo (the only step of this job with the Tripo key)
        id: make
        timeout-minutes: 110
        env:
          KEYS: ${{ needs.pick.outputs.keys }}
          MODELS_TRIPO_MAKE_RESERVE: ${{ vars.MODELS_TRIPO_MAKE_RESERVE }}
          TRIPO_API_KEY: ${{ secrets.TRIPO_API_KEY }}
        run: node scripts/models.mjs tripo-make
      - name: Bundle the state and the models made
        if: ${{ always() }}
        env:
          KEYS: ${{ needs.pick.outputs.keys }}
        run: node scripts/models.mjs bundle "$RUNNER_TEMP/out"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: models-made
          path: ${{ runner.temp }}/out
          retention-days: 3

  meshy:
    needs: pick
    if: ${{ needs.pick.outputs.keys != '' && needs.pick.outputs.generator == 'meshy' }}
    runs-on: ubuntu-latest
    timeout-minutes: 200
    permissions:
      contents: read
    outputs:
      made: ${{ steps.meshy.outputs.made }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.pick.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Make the models with Meshy (the only step with the Meshy key)
        id: meshy
        timeout-minutes: 180
        env:
          KEYS: ${{ needs.pick.outputs.keys }}
          MODELS_MESHY_RESERVE: ${{ vars.MODELS_MESHY_RESERVE }}
          MESHY_API_KEY: ${{ secrets.MESHY_API_KEY }}
        run: node scripts/models.mjs meshy
      - name: Bundle the state
        if: ${{ always() }}
        env:
          KEYS: ${{ needs.pick.outputs.keys }}
        run: node scripts/models.mjs bundle "$RUNNER_TEMP/out"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: models-made
          path: ${{ runner.temp }}/out
          retention-days: 3

  pack:
    needs: [pick, tripo-make, meshy]
    if: ${{ !cancelled() && ((needs.tripo-make.result == 'success' && needs.tripo-make.outputs.made != '') || (needs.meshy.result == 'success' && needs.meshy.outputs.made != '')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      live: ${{ steps.pack.outputs.live }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.pick.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: models-made
          path: ${{ runner.temp }}/in
      # A job that never took the make job's state bundles nothing: the checkout's own, older, state would
      # otherwise reach the commit as this job's and hide the try the make job recorded.
      - name: Take the state
        id: take
        env:
          KEYS: ${{ needs.tripo-make.outputs.made || needs.meshy.outputs.made }}
        run: node scripts/models.mjs unbundle "$RUNNER_TEMP/in"
      - name: Install the packer and the preview's browser
        run: |
          npm i --prefix "$RUNNER_TEMP/tools" --ignore-scripts --no-audit --no-fund gltfpack@1.3.0
          npm i -g --ignore-scripts --no-audit --no-fund playwright@1.63.0
          playwright install --with-deps chromium
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet numpy==2.4.6 pillow==12.3.0
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Pack and check the new models
        id: pack
        timeout-minutes: 30
        env:
          KEYS: ${{ needs.tripo-make.outputs.made || needs.meshy.outputs.made }}
        run: GLTFPACK="$RUNNER_TEMP/tools/node_modules/.bin/gltfpack" node scripts/models.mjs pack
      - name: Render a preview of each new model
        if: ${{ steps.pack.outputs.live != '' }}
        timeout-minutes: 15
        env:
          KEYS: ${{ steps.pack.outputs.live }}
        run: node scripts/models.mjs preview
      - name: Bundle the models
        if: ${{ always() && steps.take.outcome == 'success' }}
        env:
          KEYS: ${{ needs.tripo-make.outputs.made || needs.meshy.outputs.made }}
        run: node scripts/models.mjs bundle "$RUNNER_TEMP/out"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() && steps.take.outcome == 'success' }}
        with:
          name: models-pack
          path: ${{ runner.temp }}/out
          retention-days: 3

  tripo:
    needs: [pick, pack]
    if: ${{ !cancelled() && needs.pack.result == 'success' && needs.pack.outputs.live != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.pick.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: models-pack
          path: ${{ runner.temp }}/in
      # As in Pack: without the Pack job's state this job bundles nothing (the checkout's own is older).
      - name: Take the models
        id: take
        env:
          KEYS: ${{ needs.pack.outputs.live }}
        run: node scripts/models.mjs unbundle "$RUNNER_TEMP/in"
      # tools/tripo-cli and tools/tripo-rig (what `tripo.mjs plain` imports, linked where scripts/ resolves it):
      # every package at the version and hash its package-lock.json names.
      - name: Install the Tripo CLI and the rig's model decoder
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix tools/tripo-cli
          npm ci --ignore-scripts --no-audit --no-fund --prefix tools/tripo-rig
          ln -s tools/tripo-rig/node_modules node_modules
          echo "$GITHUB_WORKSPACE/tools/tripo-cli/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Rig the new models with Tripo (the only step of this job with the Tripo key)
        timeout-minutes: 45
        env:
          KEYS: ${{ needs.pack.outputs.live }}
          MODELS_TRIPO_RESERVE: ${{ vars.MODELS_TRIPO_RESERVE }}
          TRIPO_API_KEY: ${{ secrets.TRIPO_API_KEY }}
        run: node scripts/models.mjs tripo
      - name: Bundle the rig's record
        if: ${{ always() && steps.take.outcome == 'success' }}
        env:
          KEYS: ${{ needs.pack.outputs.live }}
        run: node scripts/models.mjs bundle "$RUNNER_TEMP/out"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() && steps.take.outcome == 'success' }}
        with:
          name: models-tripo
          path: ${{ runner.temp }}/out
          retention-days: 3

  commit:
    needs: [pick, tripo-make, meshy, pack, tripo]
    if: ${{ always() && needs.pick.outputs.keys != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      pushed: ${{ steps.commit.outputs.pushed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: models-made
          path: ${{ runner.temp }}/made
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: models-pack
          path: ${{ runner.temp }}/pack
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: models-tripo
          path: ${{ runner.temp }}/tripo
      - name: Check and take the models, and record every try
        id: merge
        env:
          KEYS: ${{ needs.pick.outputs.keys }}
        run: MAKE_DIR="$RUNNER_TEMP/made" PACK_DIR="$RUNNER_TEMP/pack" TRIPO_DIR="$RUNNER_TEMP/tripo" node scripts/models.mjs merge
      - name: Commit the models
        id: commit
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          LIVE: ${{ steps.merge.outputs.live }}
          MERGED: ${{ steps.merge.outcome }}
        run: |
          if [ "$MERGED" != "success" ]; then
            git checkout -- assets/models scripts/cat-models.jobs.json
            git clean -fdq -- assets/models scripts/model-previews
            LIVE=""
          fi
          for f in scripts/meshy.state.json scripts/models.state.json scripts/tripo.state.json scripts/cat-models.jobs.json assets/models/cats assets/models/PROVENANCE.md scripts/model-previews; do
            if [ -e "$f" ]; then git add -- "$f"; fi
          done
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git -c core.hooksPath=/dev/null -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Models: new 3D models for launched cats"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          if ! git -c core.hooksPath=/dev/null -c http.extraheader="AUTHORIZATION: basic $auth" push origin HEAD:main; then
            git -c core.hooksPath=/dev/null -c http.extraheader="AUTHORIZATION: basic $auth" fetch origin main
            git -c core.hooksPath=/dev/null -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" rebase origin/main
            git -c core.hooksPath=/dev/null -c http.extraheader="AUTHORIZATION: basic $auth" push origin HEAD:main
          fi
          if [ -n "$LIVE" ]; then echo "pushed=true" >> "$GITHUB_OUTPUT"; fi

  pages:
    needs: commit
    if: ${{ !cancelled() && needs.commit.outputs.pushed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Deploy the site with the new models
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh workflow run pages.yml -R "$REPO" --ref main
